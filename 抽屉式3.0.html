<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>蓝牙参数调试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{background:#f2f4f6;padding:12px;}
.page{max-width:480px;margin:0 auto;}

.host-row{
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}
.btn-host{
  flex:1;
  padding:14px;
  background:#415eff;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
}

.drawer{position:fixed;bottom:0;left:0;width:100%;height:88vh;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:99;display:none;}
.draw-header{padding:18px 16px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
.draw-title{font-size:18px;font-weight:600;}
.dev-info{font-size:12px;color:#666;margin-top:4px;}
.close{font-size:24px;color:#666;cursor:pointer;}

.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:#f7f8fa;border-bottom:1px solid #eee;}
.tab{text-align:center;padding:14px 0;font-size:15px;cursor:pointer;}
.tab.active{color:#415eff;font-weight:500;border-bottom:2px solid #415eff;}

.panel{display:none;padding:16px;overflow-y:auto;height:calc(88vh - 150px);}
.panel.active{display:block;}

.form-item{margin-bottom:14px;}
.form-label{font-size:14px;color:#333;margin-bottom:6px;display:block;}
.form-label small{color:#888;font-weight:normal;margin-left:4px;}
.form-input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;}
.form-select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px;}

/* 统一加减微调输入框 */
.spinner-input {
  display: flex;
  align-items: center;
  border: 1px solid #ddd;
  border-radius: 8px;
  overflow: hidden;
}
.spinner-input input {
  flex: 1;
  border: none;
  outline: none;
  padding: 10px;
  text-align: center;
  font-size: 14px;
}
.spinner-btn {
  width: 36px;
  height: 38px;
  background: #f1f1f1;
  border: none;
  font-size: 16px;
  cursor: pointer;
}

.step-card{
  background:#f9fafb;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  cursor: move; /* 拖拽 */
}
.step-header{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom:8px;
}
.step-title{font-size:15px;font-weight:500;}
.del-step-btn{
  color:#f44336;
  font-size:13px;
  cursor:pointer;
}
.line{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.line .item, .line2 .item{display:flex;flex-direction:column;gap:4px;}
.line label, .line2 label{font-size:12px;color:#666;white-space:nowrap;}
.line .mini, .line2 .mini{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;text-align:center;}

.btn-flex{
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}
.btn-exclusive{
  flex: 1;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
  text-align: center;
  font-size: 15px;
  cursor: pointer;
}
.btn-exclusive.active{
  background: #415eff;
  color: #fff;
  border-color: #415eff;
}

.add-step-btn{
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #415eff;
  color: #fff;
  font-size: 24px;
  border: none;
  margin: 10px 0;
  cursor: pointer;
}

.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:15px;cursor:pointer;}
.btn-query{background:#415eff;color:#fff;}
.btn-set{background:#00c06f;color:#fff;}

.tip{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none;}
.tip-result{background:#edf4ff;color:#1d4ed8;display:block;}
.tip-success{background:#e6fffa;color:#047857;display:block;}

.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.75);color:#fff;padding:12px 24px;border-radius:10px;z-index:999;display:none;}
</style>
</head>

<body>
<div class="page">
  <div class="host-row">
    <button class="btn-host" onclick="openDrawer('left')">左侧主机</button>
    <button class="btn-host" onclick="openDrawer('right')">右侧主机</button>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="draw-header">
    <div>
      <div class="draw-title">设备参数调试</div>
      <div class="dev-info" id="dev-info">已连接：左主机 | MAC: 00:11:22:33:44:55</div>
    </div>
    <div class="close" onclick="closeDrawer()">×</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">黄金韵律</div>
    <div class="tab" onclick="switchTab(1)">柔性过渡</div>
    <div class="tab" onclick="switchTab(2)">智能力线</div>
  </div>

  <!-- 黄金韵律 -->
  <div class="panel active" id="p0">
    <div class="tip" id="tip0"></div>
    <div class="step-title">步骤参数</div>
    <div id="gold_step_list"></div>
    <button class="add-step-btn" onclick="addGoldStep()">+</button>
    <div class="btn-row">
      <button class="btn btn-query" onclick="queryGold()">查询参数</button>
      <button class="btn btn-set" onclick="setGold()">保存设置</button>
    </div>
  </div>

  <!-- 柔性过渡 -->
  <div class="panel" id="p1">
    <div class="tip" id="tip1"></div>
    <div class="form-item">
      <label class="form-label">柔性使能</label>
      <div class="btn-flex">
        <div class="btn-exclusive" onclick="selectSoft(0)">未使能</div>
        <div class="btn-exclusive" onclick="selectSoft(1)">使能</div>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">柔性步进(kPa) <small>1~10</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('soft_step',-1,1,10)">−</button>
        <input type="number" id="soft_step" value="1">
        <button class="spinner-btn" onclick="spin('soft_step',1,1,10)">+</button>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">柔性步数 <small>1~10</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('soft_cnt',-1,1,10)">−</button>
        <input type="number" id="soft_cnt" value="1">
        <button class="spinner-btn" onclick="spin('soft_cnt',1,1,10)">+</button>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">启动跨度 <small>1~15</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('soft_lv',-1,1,15)">−</button>
        <input type="number" id="soft_lv" value="1">
        <button class="spinner-btn" onclick="spin('soft_lv',1,1,15)">+</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-query" onclick="querySoft()">查询参数</button>
      <button class="btn btn-set" onclick="setSoft()">保存设置</button>
    </div>
  </div>

  <!-- 智能力线 -->
  <div class="panel" id="p2">
    <div class="tip" id="tip2"></div>
    <div class="form-item">
      <label class="form-label">工作模式</label>
      <div class="btn-flex">
        <div class="btn-exclusive" onclick="selectLineMode(0)">刺激</div>
        <div class="btn-exclusive" onclick="selectLineMode(1)">吸乳</div>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">档位 <small>1~15</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('line_lv',-1,1,15)">−</button>
        <input type="number" id="line_lv" value="1">
        <button class="spinner-btn" onclick="spin('line_lv',1,1,15)">+</button>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">最大负压(kPa) <small>10~40</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('line_press',-1,10,40)">−</button>
        <input type="number" id="line_press" value="25">
        <button class="spinner-btn" onclick="spin('line_press',1,10,40)">+</button>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">吸放频率(pcm) <small>20~90</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('line_freq',-1,20,90)">−</button>
        <input type="number" id="line_freq" value="50">
        <button class="spinner-btn" onclick="spin('line_freq',1,20,90)">+</button>
      </div>
    </div>
    <div class="form-item">
      <label class="form-label">吸力保持时间(ms) <small>0~1000</small></label>
      <div class="spinner-input">
        <button class="spinner-btn" onclick="spin('line_t2',-1,0,1000)">−</button>
        <input type="number" id="line_t2" value="300">
        <button class="spinner-btn" onclick="spin('line_t2',1,0,1000)">+</button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-query" onclick="queryLine()">查询参数</button>
      <button class="btn btn-set" onclick="setLine()">保存设置</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentTab = 0;
let currSide = 'left';
let goldSteps = []; // 存储所有步骤
let softEnable = 0;
let lineWorkMode = 0;

// 打开抽屉
function openDrawer(side) {
  currSide = side;
  const mac = side === 'left' ? '00:11:22:33:44:55' : 'AA:BB:CC:DD:EE:FF';
  document.getElementById('dev-info').textContent = `已连接：${side==='left'?'左':'右'}主机 | MAC: ${mac}`;
  document.getElementById('drawer').style.display = 'block';
  goldSteps = [];
  renderGoldSteps();

  setTimeout(()=>{
    if(currentTab == 0) queryGold();
    if(currentTab == 1) querySoft();
    if(currentTab == 2) queryLine();
  }, 100);
}

function closeDrawer() {
  document.getElementById('drawer').style.display = 'none';
}

// 切换TAB
function switchTab(i) {
  currentTab = i;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  document.querySelectorAll('.panel').forEach((p,j)=>p.classList.toggle('active',j===i));

  if(i == 0) queryGold();
  if(i == 1) querySoft();
  if(i == 2) queryLine();
}

// 提示
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none',1600);
}
function showTip(i, text, cls) {
  const e = document.getElementById('tip'+i);
  e.textContent = text; e.className = 'tip '+cls;
}

// 互斥按钮
function selectSoft(val) {
  softEnable = val;
  document.querySelectorAll('#p1 .btn-exclusive').forEach((btn, idx)=>{
    btn.classList.toggle('active', idx === val);
  });
}
function selectLineMode(val) {
  lineWorkMode = val;
  document.querySelectorAll('#p2 .btn-exclusive').forEach((btn, idx)=>{
    btn.classList.toggle('active', idx === val);
  });
}

// 统一加减微调
function spin(id, dir, min, max) {
  const ipt = document.getElementById(id);
  let v = parseInt(ipt.value) || min;
  v += dir;
  if(v < min) v = min;
  if(v > max) v = max;
  ipt.value = v;
}

// ====================== 黄金韵律：删除 + 拖拽排序 ======================
function renderGoldSteps() {
  let html = '';
  goldSteps.forEach((s, idx) => {
    html += `
    <div class="step-card" draggable="true" data-idx="${idx}">
      <div class="step-header">
        <div>步骤 ${idx+1}</div>
        <div class="del-step-btn" onclick="deleteStep(${idx})">删除</div>
      </div>
      <div class="line">
        <div class="item">
          <label>模式</label>
          <select class="mini" id="g_m${idx}">
            <option value="">请选择</option>
            <option value="0" ${s.m==0?'selected':''}>刺激</option>
            <option value="1" ${s.m==1?'selected':''}>吸乳</option>
            <option value="2" ${s.m==2?'selected':''}>5短1长</option>
            <option value="5" ${s.m==5?'selected':''}>休息</option>
          </select>
        </div>
        <div class="item">
          <label>档位 <small>1~15</small></label>
          <div class="spinner-input">
            <button class="spinner-btn" onclick="spin('g_g${idx}',-1,1,15)">−</button>
            <input type="number" id="g_g${idx}" class="spinner-input" value="${s.g||1}" min="1" max="15">
            <button class="spinner-btn" onclick="spin('g_g${idx}',1,1,15)">+</button>
          </div>
        </div>
        <div class="item">
          <label>时间(s) <small>0~1800</small></label>
          <div class="spinner-input">
            <button class="spinner-btn" onclick="spin('g_t${idx}',-1,0,1800)">−</button>
            <input type="number" id="g_t${idx}" value="${s.t||0}" min="0" max="1800">
            <button class="spinner-btn" onclick="spin('g_t${idx}',1,0,1800)">+</button>
          </div>
        </div>
      </div>
    </div>`;
  });
  const list = document.getElementById('gold_step_list');
  list.innerHTML = html;

  // 绑定拖拽
  bindDrag();
}

// 添加步骤
function addGoldStep() {
  if(goldSteps.length >= 10) {
    showToast("最多10个步骤");
    return;
  }
  goldSteps.push({m:1, g:6, t:12});
  renderGoldSteps();
}

// 删除步骤
function deleteStep(idx) {
  goldSteps.splice(idx, 1);
  renderGoldSteps();
  showToast("步骤已删除");
}

// 拖拽排序
function bindDrag() {
  const cards = document.querySelectorAll('.step-card');
  cards.forEach(card => {
    card.ondragstart = (e) => {
      e.dataTransfer.setData('idx', card.dataset.idx);
    };
    card.ondragover = (e) => e.preventDefault();
    card.ondrop = (e) => {
      const oldIdx = e.dataTransfer.getData('idx');
      const newIdx = card.dataset.idx;
      const temp = goldSteps[oldIdx];
      goldSteps[oldIdx] = goldSteps[newIdx];
      goldSteps[newIdx] = temp;
      renderGoldSteps();
    };
  });
}

// 查询
function queryGold() {
  goldSteps = [
    {m:1, g:6, t:12},
    {m:1, g:8, t:30}
  ];
  renderGoldSteps();
  showTip(0, '查询成功，数据已加载', 'tip-result');
  showToast('查询成功');
}
function setGold() {
  showTip(0, '黄金韵律保存成功', 'tip-success');
  showToast('黄金韵律保存成功');
}

// ====================== 柔性过渡 ======================
function querySoft() {
  selectSoft(1);
  document.getElementById('soft_step').value = 5;
  document.getElementById('soft_cnt').value = 3;
  document.getElementById('soft_lv').value = 5;
  showTip(1, '查询成功，数据已加载', 'tip-result');
  showToast('查询成功');
}
function setSoft() {
  showTip(1, '柔性过渡保存成功', 'tip-success');
  showToast('柔性过渡保存成功');
}

// ====================== 智能力线 ======================
function queryLine() {
  selectLineMode(0);
  document.getElementById('line_lv').value = 5;
  document.getElementById('line_press').value = 25;
  document.getElementById('line_freq').value = 50;
  document.getElementById('line_t2').value = 300;
  showTip(2, '查询成功，数据已加载', 'tip-result');
  showToast('查询成功');
}
function setLine() {
  showTip(2, '智能力线保存成功', 'tip-success');
  showToast('智能力线保存成功');
}
</script>
</body>
</html>
