name: app-b-ci

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

# This workflow compiles non-distributable B smoke artifacts only.
# Android is debug-signed; iOS is unsigned. No release signing, deployment or store upload.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          flutter pub get
      - name: Validate B target and compile-time email login
        run: |
          python3 scripts/prepare_b_ci_config.py --output "${RUNNER_TEMP}/b-ci-defines.json"
          node scripts/build-mobile-app.mjs --platform android --environment staging --mode release --format appbundle --release-lane north-america-staging --config config/release-lanes/north-america-staging.ci.json --check-config
          node scripts/build-mobile-app.mjs --platform ios --environment staging --mode release --format ipa --release-lane north-america-staging --config config/release-lanes/north-america-staging.ci.json --check-config
      - name: Check scripts, contracts, Android packaging and privacy
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/validate_backend_contract.py
          node scripts/check-flutter-android-packaging.mjs
          node scripts/check-flutter-security-privacy.mjs
      - name: Reject Dart formatting drift
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test non-golden suite
        run: flutter test --no-pub --exclude-tags=golden
      - name: Verify B compile-time email login UI
        run: flutter test --no-pub --dart-define=MOMCOZY_INTERNAL_INVITE_LOGIN=false test/features/auth/release_lane_auth_mode_test.dart

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: true
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile B Play flavor debug APK (not a store artifact)
        run: |
          flutter pub get
          python3 scripts/prepare_b_ci_config.py --output "${RUNNER_TEMP}/b-ci-defines.json"
          flutter build apk --debug --flavor play --target-platform android-arm64 \
            --dart-define-from-file="${RUNNER_TEMP}/b-ci-defines.json" --no-pub
          unzip -Z1 build/app/outputs/flutter-apk/app-play-debug.apk | grep -Fx lib/arm64-v8a/libpdfium.so
          aapt="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -n "${aapt}"
          "${aapt}" dump badging build/app/outputs/flutter-apk/app-play-debug.apk | grep -F "package: name='com.momcozy.mai'"

  ios-compile:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode 26.6 for device_info_plus iOS APIs
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version | grep -Fx 'Xcode 26.6'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile B iOS staging scheme for simulator without signing
        run: |
          flutter pub get
          python3 scripts/prepare_b_ci_config.py --output "${RUNNER_TEMP}/b-ci-defines.json"
          flutter build ios --simulator --debug --no-codesign --flavor staging \
            --dart-define-from-file="${RUNNER_TEMP}/b-ci-defines.json" --no-pub
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)" = 'com.momcozy.mai.staging'

  golden:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - name: Verify canonical macOS goldens
        env:
          TZ: Asia/Shanghai
          MOMCOZY_GOLDEN_PRECISION_TOLERANCE: "0.011"
        run: |
          flutter pub get
          flutter test --no-pub --tags=golden

  b-ci:
    if: always()
    needs: [quality, android-compile, ios-compile, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all B App gates
        run: |
          [[ "${{ needs.quality.result }}" == "success" ]]
          [[ "${{ needs.android-compile.result }}" == "success" ]]
          [[ "${{ needs.ios-compile.result }}" == "success" ]]
          [[ "${{ needs.golden.result }}" == "success" ]]
