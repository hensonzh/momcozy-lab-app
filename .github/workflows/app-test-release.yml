name: app-test-release

on:
  workflow_dispatch:
    inputs:
      backend_commit_sha:
        description: Deployed Product Backend full commit SHA.
        required: true
        type: string
      backend_image_digest:
        description: Deployed Product Backend sha256 image digest.
        required: true
        type: string
      backend_openapi_sha256:
        description: Expected Product Backend public OpenAPI SHA-256.
        required: true
        type: string
      agent_commit_sha:
        description: Deployed Agent Runtime full commit SHA.
        required: true
        type: string
      agent_image_digest:
        description: Deployed Agent Runtime sha256 image digest.
        required: true
        type: string
      agent_openapi_sha256:
        description: Expected Agent Runtime public OpenAPI SHA-256.
        required: true
        type: string

permissions:
  contents: read
  issues: read

concurrency:
  group: momcozy-lab-app-test
  cancel-in-progress: false

jobs:
  approve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Wait for independent test approval
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_APPROVERS: ${{ vars.TEST_APPROVERS }}
          TEST_APPROVAL_ISSUE: ${{ vars.TEST_APPROVAL_ISSUE }}
        run: |
          set -euo pipefail
          [[ "${TEST_APPROVAL_ISSUE}" =~ ^[1-9][0-9]*$ ]] || {
            echo "TEST_APPROVAL_ISSUE must name the repository's approval issue." >&2
            exit 1
          }

          IFS=',' read -r -a raw_approvers <<< "${TEST_APPROVERS}"
          normalized_approvers=","
          for raw_approver in "${raw_approvers[@]}"; do
            approver="${raw_approver//[[:space:]]/}"
            approver="${approver,,}"
            [[ "${approver}" =~ ^[a-z0-9]([a-z0-9-]{0,37}[a-z0-9])?$ ]] || {
              echo "TEST_APPROVERS must be a comma-separated GitHub login allowlist." >&2
              exit 1
            }
            normalized_approvers+="${approver},"
          done
          [[ "${normalized_approvers}" != "," ]] || {
            echo "TEST_APPROVERS must contain at least one GitHub login." >&2
            exit 1
          }

          expected_approval="/approve-test ${GITHUB_REPOSITORY} ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} ${GITHUB_SHA}"
          printf 'Waiting for an allowlisted reviewer to comment:\n%s\n' "${expected_approval}"
          printf 'Approval command: `%s`\n' "${expected_approval}" >> "${GITHUB_STEP_SUMMARY}"

          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            candidate_output="$(
              EXPECTED_APPROVAL="${expected_approval}" gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues/${TEST_APPROVAL_ISSUE}/comments?per_page=100" \
                --jq '.[] | select(.body == env.EXPECTED_APPROVAL) | .user.login'
            )"
            approved_by=""
            while IFS= read -r candidate; do
              [[ -n "${candidate}" ]] || continue
              candidate="${candidate,,}"
              if [[ "${normalized_approvers}" == *",${candidate},"* ]]; then
                approved_by="${candidate}"
                break
              else
                echo "Ignoring approval from non-allowlisted user ${candidate}." >&2
              fi
            done <<< "${candidate_output}"
            if [[ -n "${approved_by}" ]]; then
              echo "Test delivery approved by ${approved_by}."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for independent test approval." >&2
          exit 1

  release:
    needs: approve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: test
      url: https://hensonzh.github.io/momcozy-lab-releases/unified/
    env:
      MOMCOZY_API_BASE_URL: https://backend-test.lute-momcozylab.luteos.cloud:8443
      MOMCOZY_AGENT_API_BASE_URL: https://agent-test.lute-momcozylab.luteos.cloud:8443
      MOMCOZY_APK_FLAVOR: unified
      MOMCOZY_APK_MODE: release
      MOMCOZY_REQUIRE_RELEASE_SIGNING: "1"
      MOMCOZY_REQUIRE_TEST_JOIN_BARRIER: "1"
      MOMCOZY_TEST_SMOKE: "1"
      MOMCOZY_TEST_SMOKE_MUTATE: "1"
      MOMCOZY_TEST_SMOKE_AGENT: "1"
      MOMCOZY_BACKEND_COMMIT_SHA: ${{ inputs.backend_commit_sha }}
      MOMCOZY_BACKEND_IMAGE_DIGEST: ${{ inputs.backend_image_digest }}
      MOMCOZY_BACKEND_OPENAPI_SHA256: ${{ inputs.backend_openapi_sha256 }}
      MOMCOZY_AGENT_COMMIT_SHA: ${{ inputs.agent_commit_sha }}
      MOMCOZY_AGENT_IMAGE_DIGEST: ${{ inputs.agent_image_digest }}
      MOMCOZY_AGENT_OPENAPI_SHA256: ${{ inputs.agent_openapi_sha256 }}
      SSL_CERT_FILE: ${{ github.workspace }}/assets/certificates/momcozy-test-internal-ca.pem
      TEST_RELEASE_LOCK: /opt/momcozy-lab/shared/test-release.lock
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure runner-scoped paths
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/momcozy-release.jks
        run: printf 'MOMCOZY_FLUTTER_RELEASE_STORE_FILE=%s\n' "${RELEASE_STORE_FILE}" >> "${GITHUB_ENV}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies before issuing short-lived credentials
        run: |
          npm ci --ignore-scripts
          flutter pub get

      - name: Materialize the protected Android signing key
        env:
          FLUTTER_RELEASE_KEYSTORE_BASE64: ${{ secrets.FLUTTER_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "${FLUTTER_RELEASE_KEYSTORE_BASE64}"
          printf '%s' "${FLUTTER_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${MOMCOZY_FLUTTER_RELEASE_STORE_FILE}"
          chmod 0600 "${MOMCOZY_FLUTTER_RELEASE_STORE_FILE}"

      - name: Trust the bundled test CA for live-smoke requests
        run: |
          sudo install -m 0644 "${SSL_CERT_FILE}" /usr/local/share/ca-certificates/momcozy-test.crt
          sudo update-ca-certificates

      - name: Configure verified SSH access to deployed release manifests
        env:
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "${HOME}/.ssh"
          install -m 0600 /dev/null "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/id_ed25519"
          printf '%s\n' "${TEST_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"

      - name: Fetch the currently deployed service manifests
        env:
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
        run: |
          scp -P "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:/opt/momcozy-lab/current/backend/release-manifest.json" \
            /tmp/backend-release-manifest.json
          scp -P "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:/opt/momcozy-lab/current/agent/release-manifest.json" \
            /tmp/agent-release-manifest.json

      - name: Validate immutable service identities and live OpenAPI contracts
        run: |
          python3 scripts/validate_test_service_manifests.py \
            --backend /tmp/backend-release-manifest.json \
            --agent /tmp/agent-release-manifest.json
          curl --fail --silent --show-error --retry 3 \
            --cacert "${SSL_CERT_FILE}" \
            "${MOMCOZY_API_BASE_URL}/openapi.json" \
            --output /tmp/backend-openapi.json
          curl --fail --silent --show-error --retry 3 \
            --cacert "${SSL_CERT_FILE}" \
            "${MOMCOZY_AGENT_API_BASE_URL}/openapi.json" \
            --output /tmp/agent-openapi.json
          test "$(sha256sum docs/backend-contract/product.openapi.generated.json | cut -d ' ' -f 1)" = "${MOMCOZY_BACKEND_OPENAPI_SHA256}"
          test "$(sha256sum docs/backend-contract/agent-runtime.openapi.generated.json | cut -d ' ' -f 1)" = "${MOMCOZY_AGENT_OPENAPI_SHA256}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          pairs = (
              (Path("/tmp/backend-openapi.json"), Path("docs/backend-contract/product.openapi.generated.json")),
              (Path("/tmp/agent-openapi.json"), Path("docs/backend-contract/agent-runtime.openapi.generated.json")),
          )
          for live_path, pinned_path in pairs:
              if json.loads(live_path.read_text()) != json.loads(pinned_path.read_text()):
                  raise SystemExit(f"live OpenAPI does not match {pinned_path}")
          PY

      - name: Obtain a fresh isolated-account access token immediately before smoke
        env:
          TEST_SMOKE_INVITE_CODE: ${{ secrets.TEST_SMOKE_INVITE_CODE }}
          TEST_SMOKE_DEVICE_ID: ${{ secrets.TEST_SMOKE_DEVICE_ID }}
        run: |
          test -n "${TEST_SMOKE_INVITE_CODE}"
          test -n "${TEST_SMOKE_DEVICE_ID}"
          request_file="${RUNNER_TEMP}/test-smoke-login-request.json"
          response_file="${RUNNER_TEMP}/test-smoke-login-response.json"
          install -m 0600 /dev/null "${request_file}"
          REQUEST_FILE="${request_file}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path(os.environ["REQUEST_FILE"]).write_text(json.dumps({
              "invite_code": os.environ["TEST_SMOKE_INVITE_CODE"],
              "device_id": os.environ["TEST_SMOKE_DEVICE_ID"],
          }))
          PY
          install -m 0600 /dev/null "${response_file}"
          curl --fail-with-body --silent --show-error \
            --cacert "${SSL_CERT_FILE}" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_file}" \
            "${MOMCOZY_API_BASE_URL}/v1/auth/invite-login" \
            --output "${response_file}"
          AUTH_RESPONSE_FILE="${response_file}" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(Path(os.environ["AUTH_RESPONSE_FILE"]).read_text())
          token = str(payload.get("access_token", "")).strip()
          user_id = str((payload.get("user") or {}).get("id", "")).strip()
          if not token or "\n" in token:
              raise SystemExit("invite login returned no safe access token")
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", user_id):
              raise SystemExit("invite login returned no user id")
          print(f"::add-mask::{token}")
          with Path(os.environ["GITHUB_ENV"]).open("a") as output:
              output.write(f"MOMCOZY_API_TOKEN={token}\n")
              output.write(f"MOMCOZY_DEFAULT_USER_ID={user_id}\n")
          PY
          rm -f "${request_file}" "${response_file}"

      - name: Resolve or provision the isolated smoke infant
        run: |
          infants_file="${RUNNER_TEMP}/test-smoke-infants.json"
          created_file="${RUNNER_TEMP}/test-smoke-created-infant.json"
          trap 'rm -f "${infants_file}" "${created_file}"' EXIT
          install -m 0600 /dev/null "${infants_file}"
          install -m 0600 /dev/null "${created_file}"
          curl --fail-with-body --silent --show-error \
            --cacert "${SSL_CERT_FILE}" \
            --header "Authorization: Bearer ${MOMCOZY_API_TOKEN}" \
            "${MOMCOZY_API_BASE_URL}/v1/profile/infants" \
            --output "${infants_file}"
          baby_id="$(
            INFANTS_FILE="${infants_file}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from uuid import UUID

          payload = json.loads(Path(os.environ["INFANTS_FILE"]).read_text())
          items = payload.get("items")
          if not isinstance(items, list):
              raise SystemExit("profile infants response has no items list")
          if items:
              print(UUID(str(items[0].get("id", ""))))
          PY
          )"
          if [[ -z "${baby_id}" ]]; then
            curl --fail-with-body --silent --show-error \
              --cacert "${SSL_CERT_FILE}" \
              --request POST \
              --header "Authorization: Bearer ${MOMCOZY_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "Idempotency-Key: app-test-smoke-infant-v1" \
              --data '{"name":"Test Smoke Infant","sex_at_birth":"unknown"}' \
              "${MOMCOZY_API_BASE_URL}/v1/profile/infants" \
              --output "${created_file}"
            baby_id="$(
              CREATED_FILE="${created_file}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from uuid import UUID

          payload = json.loads(Path(os.environ["CREATED_FILE"]).read_text())
          print(UUID(str(payload.get("id", ""))))
          PY
            )"
          fi
          [[ "${baby_id}" =~ ^[0-9a-f-]{36}$ ]]
          printf 'MOMCOZY_DEFAULT_BABY_ID=%s\n' "${baby_id}" >> "${GITHUB_ENV}"

      - name: Run the signed release gate and live Product-Agent join smoke
        env:
          MOMCOZY_FLUTTER_RELEASE_STORE_PASSWORD: ${{ secrets.FLUTTER_RELEASE_STORE_PASSWORD }}
          MOMCOZY_FLUTTER_RELEASE_KEY_ALIAS: ${{ secrets.FLUTTER_RELEASE_KEY_ALIAS }}
          MOMCOZY_FLUTTER_RELEASE_KEY_PASSWORD: ${{ secrets.FLUTTER_RELEASE_KEY_PASSWORD }}
        run: node scripts/run-flutter-release-gate.mjs

      - name: Record the signing certificate identity
        env:
          MOMCOZY_FLUTTER_RELEASE_STORE_PASSWORD: ${{ secrets.FLUTTER_RELEASE_STORE_PASSWORD }}
          MOMCOZY_FLUTTER_RELEASE_KEY_ALIAS: ${{ secrets.FLUTTER_RELEASE_KEY_ALIAS }}
        run: |
          signing_cert_sha256="$(
            keytool -exportcert \
              -alias "${MOMCOZY_FLUTTER_RELEASE_KEY_ALIAS}" \
              -keystore "${MOMCOZY_FLUTTER_RELEASE_STORE_FILE}" \
              -storepass "${MOMCOZY_FLUTTER_RELEASE_STORE_PASSWORD}" | \
              sha256sum | cut -d ' ' -f 1
          )"
          [[ "${signing_cert_sha256}" =~ ^[0-9a-f]{64}$ ]]
          printf 'MOMCOZY_APK_SIGNING_CERT_SHA256=%s\n' "${signing_cert_sha256}" >> "${GITHUB_ENV}"

      - name: Fetch the currently deployed service manifests again under the lock and publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          TEST_SSH_HOST: ${{ secrets.TEST_SSH_HOST }}
          TEST_SSH_PORT: ${{ secrets.TEST_SSH_PORT }}
          TEST_SSH_USER: ${{ secrets.TEST_SSH_USER }}
          MOMCOZY_APK_INPUT: ${{ github.workspace }}/build/app/outputs/flutter-apk/app-unified-release.apk
          MOMCOZY_SKIP_NPM_CI: "1"
          MOMCOZY_GITHUB_RELEASE_REPO: hensonzh/momcozy-lab-releases
          MOMCOZY_DOWNLOAD_BASE_URL: https://hensonzh.github.io/momcozy-lab-releases
          MOMCOZY_FLUTTER_RELEASE_STORE_PASSWORD: ${{ secrets.FLUTTER_RELEASE_STORE_PASSWORD }}
          MOMCOZY_FLUTTER_RELEASE_KEY_ALIAS: ${{ secrets.FLUTTER_RELEASE_KEY_ALIAS }}
          MOMCOZY_FLUTTER_RELEASE_KEY_PASSWORD: ${{ secrets.FLUTTER_RELEASE_KEY_PASSWORD }}
        run: |
          lock_marker="${RUNNER_TEMP}/test-release-lock.marker"
          lock_log="${RUNNER_TEMP}/test-release-lock.log"
          install -m 0600 /dev/null "${lock_marker}"
          install -m 0600 /dev/null "${lock_log}"
          lock_pid=""
          release_lock() {
            if [[ -n "${lock_pid}" ]] && kill -0 "${lock_pid}" 2>/dev/null; then
              kill "${lock_pid}" 2>/dev/null || true
              wait "${lock_pid}" 2>/dev/null || true
            fi
          }
          trap release_lock EXIT
          ssh \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            -p "${TEST_SSH_PORT}" "${TEST_SSH_USER}@${TEST_SSH_HOST}" \
            "/usr/bin/flock --exclusive --timeout 1800 '${TEST_RELEASE_LOCK}' sh -c 'printf \"locked\\n\"; trap \"exit 0\" HUP INT TERM; while :; do sleep 60; done'" \
            > "${lock_marker}" 2> "${lock_log}" &
          lock_pid="$!"
          for _attempt in $(seq 1 1800); do
            if grep -qx locked "${lock_marker}"; then
              break
            fi
            if ! kill -0 "${lock_pid}" 2>/dev/null; then
              cat "${lock_log}" >&2
              exit 1
            fi
            sleep 1
          done
          grep -qx locked "${lock_marker}"

          scp -P "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:/opt/momcozy-lab/current/backend/release-manifest.json" \
            /tmp/backend-release-manifest-final.json
          scp -P "${TEST_SSH_PORT}" \
            "${TEST_SSH_USER}@${TEST_SSH_HOST}:/opt/momcozy-lab/current/agent/release-manifest.json" \
            /tmp/agent-release-manifest-final.json
          python3 scripts/validate_test_service_manifests.py \
            --backend /tmp/backend-release-manifest-final.json \
            --agent /tmp/agent-release-manifest-final.json
          bash scripts/build-flutter-app.sh
          kill -0 "${lock_pid}"

      - name: Record and upload the published immutable artifact
        run: |
          sha256sum dist/android-apk/releases/*.apk
          test "$(find dist/android-apk/releases -name '*.apk' -type f | wc -l | tr -d ' ')" = "1"
          provenance_file="$(python3 -c 'import json; print(json.load(open("dist/android-apk/manifest.json"))["provenanceFile"])')"
          test -f "dist/android-apk/releases/${provenance_file}"

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: momcozy-unified-release-${{ github.sha }}
          path: dist/android-apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing and SSH material
        if: always()
        run: |
          rm -f "${MOMCOZY_FLUTTER_RELEASE_STORE_FILE}"
          rm -f "${HOME}/.ssh/id_ed25519"
