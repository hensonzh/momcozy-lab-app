name: backend-contract

on:
  pull_request:
    paths:
      - ".github/workflows/backend-contract.yml"
      - "Makefile"
      - "docs/backend-contract/**"
      - "scripts/build-flutter-android-apk.mjs"
      - "scripts/build-flutter-apk-download-site.mjs"
      - "scripts/build-flutter-app.sh"
      - "scripts/flutter-api-config.mjs"
      - "scripts/run-flutter-invite-dev.mjs"
      - "scripts/run-flutter-release-gate.mjs"
      - "scripts/validate_backend_contract.py"
      - "scripts/tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-contract.yml"
      - "Makefile"
      - "docs/backend-contract/**"
      - "scripts/build-flutter-android-apk.mjs"
      - "scripts/build-flutter-apk-download-site.mjs"
      - "scripts/build-flutter-app.sh"
      - "scripts/flutter-api-config.mjs"
      - "scripts/run-flutter-invite-dev.mjs"
      - "scripts/run-flutter-release-gate.mjs"
      - "scripts/validate_backend_contract.py"
      - "scripts/tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-split-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out App
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test contract and release config validators
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate Product and Agent Runtime boundaries
        run: python3 scripts/validate_backend_contract.py
