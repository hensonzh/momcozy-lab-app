name: app-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MOMCOZY_API_BASE_URL: https://backend-test.lute-momcozylab.luteos.cloud:8443
      MOMCOZY_AGENT_API_BASE_URL: https://agent-test.lute-momcozylab.luteos.cloud:8443
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts
          flutter pub get

      - name: Validate build and service contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/validate_backend_contract.py
          node scripts/check-flutter-android-packaging.mjs
          node scripts/check-flutter-security-privacy.mjs

      - name: Reject Dart formatting drift
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test
        run: flutter test --no-pub --exclude-tags=golden

      - name: Build a staging-shaped unified smoke APK
        run: |
          node scripts/build-flutter-android-apk.mjs \
            --mode debug \
            --flavor unified \
            --dart-define=MOMCOZY_ENV=staging \
            --dart-define=MOMCOZY_API_BASE_URL="${MOMCOZY_API_BASE_URL}" \
            --dart-define=MOMCOZY_AGENT_API_BASE_URL="${MOMCOZY_AGENT_API_BASE_URL}"

      - name: Upload the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: momcozy-unified-smoke-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-unified-debug.apk
          if-no-files-found: error
          retention-days: 7

  golden:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify canonical macOS golden baselines
        run: flutter test --no-pub --tags=golden
