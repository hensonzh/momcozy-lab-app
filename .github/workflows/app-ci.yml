name: app-ci

on:
  pull_request:
  push:
    branches:
      - main
      - "integration/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install build dependencies
        run: |
          npm ci --ignore-scripts
          flutter pub get

      - name: Validate build and service contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          python3 scripts/validate_backend_contract.py
          node scripts/check-flutter-android-packaging.mjs
          node scripts/check-flutter-security-privacy.mjs

      - name: Reject Dart formatting drift
        run: >-
          dart format --output=none --set-exit-if-changed
          lib test integration_test tool

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Test non-golden suite
        run: flutter test --no-pub --exclude-tags=golden

  android-compile:
    # Independent runner: compile the A staging flavor without waiting for tests
    # or reusing their disk-heavy Flutter intermediates. This is not a release APK.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate A staging endpoints
        run: >-
          node scripts/build-mobile-app.mjs
          --platform android
          --environment staging
          --mode debug
          --format apk
          --check-config

      - name: Compile A staging debug APK for arm64
        run: |
          df -h .
          flutter build apk --debug --flavor staging \
            --target-platform android-arm64 \
            --dart-define-from-file=config/environments/staging.json \
            --dart-define=MOMCOZY_INTERNAL_INVITE_LOGIN=true \
            --no-pub
          df -h .

      - name: Verify arm64 PDF native library
        run: >-
          unzip -Z1 build/app/outputs/flutter-apk/app-staging-debug.apk |
          grep -Fx lib/arm64-v8a/libpdfium.so

  quality-and-build:
    # Keep the existing required-check name while making both independent jobs mandatory.
    if: always()
    needs:
      - quality
      - android-compile
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require tests and Android compilation
        run: |
          [[ "${{ needs.quality.result }}" == "success" ]]
          [[ "${{ needs.android-compile.result }}" == "success" ]]

  golden:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify canonical macOS golden baselines
        env:
          TZ: Asia/Shanghai
          MOMCOZY_GOLDEN_PRECISION_TOLERANCE: "0.011"
        run: flutter test --no-pub --tags=golden
